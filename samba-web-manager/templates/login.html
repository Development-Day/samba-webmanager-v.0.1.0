<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВХОД - {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="text-center mb-3">
                <i class="bi bi-server" style="font-size: 48px; color: #00ffff; text-shadow: 0 0 30px #00ffff;"></i>
            </div>
            <h1 class="login-title">SAMBA</h1>
            <p class="login-subtitle">WEB MANAGER</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label><i class="bi bi-person"></i> ЛОГИН</label>
                    <input type="text" name="username" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label><i class="bi bi-lock"></i> ПАРОЛЬ</label>
                    <input type="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-3">
                    <i class="bi bi-box-arrow-in-right"></i> ВОЙТИ
                </button>
            </form>

            <div class="login-footer">
                {{ app_name }} v{{ app_version }}
            </div>
        </div>
    </div>
</body>
</html>
