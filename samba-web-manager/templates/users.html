{% extends "layout.html" %}

{% block title %}Пользователи{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center border-bottom">
    <h1><i class="bi bi-people"></i> ПОЛЬЗОВАТЕЛИ SAMBA</h1>
    <button onclick="showAddUser()" class="btn btn-primary">
        <i class="bi bi-person-plus"></i> ДОБАВИТЬ
    </button>
</div>

<div id="users-list">
    <div class="text-center text-muted py-5">
        <i class="bi bi-people display-1"></i>
        <p>Загрузка...</p>
    </div>
</div>

<div class="modal-overlay" id="userModal">
    <div class="modal">
        <div class="modal-header">
            <h5 class="modal-title">ДОБАВИТЬ ПОЛЬЗОВАТЕЛЯ</h5>
            <button class="modal-close" onclick="closeModal('userModal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="userForm">
                <div class="mb-3">
                    <label>ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
                    <input type="text" id="userName" required>
                    <small>Будет создан системный пользователь</small>
                </div>
                <div class="mb-3">
                    <label>ПАРОЛЬ (МИН. 8 СИМВОЛОВ)</label>
                    <input type="password" id="userPassword" required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('userModal')">ОТМЕНА</button>
            <button class="btn btn-primary" onclick="saveUser()">СОХРАНИТЬ</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/users.js') }}"></script>
{% endblock %}
