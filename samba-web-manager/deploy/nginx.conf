# ============================================
# Nginx конфигурация для Samba Web Manager
# ============================================
# 
# Использование:
# 1. Скопируйте в /etc/nginx/sites-available/samba-web
# 2. Активируйте: ln -s /etc/nginx/sites-available/samba-web /etc/nginx/sites-enabled/
# 3. Проверьте: nginx -t
# 4. Перезапустите: systemctl reload nginx
# ============================================

upstream samba_web {
    # Gunicorn слушает на 5000
    server 127.0.0.1:5000 fail_timeout=0;
}

# HTTP сервер (редирект на HTTPS если есть SSL)
server {
    listen 80;
    listen [::]:80;
    server_name samba.local _;

    # Если нужен HTTPS - раскомментируйте редирект
    # return 301 https://$server_name$request_uri;

    # Если HTTPS не настроен - проксируем напрямую
    location / {
        proxy_pass http://samba_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

